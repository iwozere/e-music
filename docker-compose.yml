# Backend only. TLS / tunnel / reverse proxy (Caddy, nginx, Traefik, cloudflared, etc.)
# live in separate infra; optional external network below lets a proxy on that network
# reach this service as host name "backend" port 8000.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      # Host paths: MUSIC_HOST_ROOT if set, else MUSIC_PATH (folder that contains library/, cache/, db/)
      - ${MUSIC_HOST_ROOT:-${MUSIC_PATH}}/library:/app/library
      - ${MUSIC_HOST_ROOT:-${MUSIC_PATH}}/cache:/app/cache
      - ${MUSIC_HOST_ROOT:-${MUSIC_PATH}}/db:/app/db
      - ./backend/app:/app/app
      - ./cookies.txt:/app/cookies.txt:ro
    env_file: .env
    # Inside the container paths must match the volume targets above (do not use host paths here).
    environment:
      MUSIC_PATH: /app/library
      CACHE_DIR: /app/cache
    depends_on:
      - db-init
    networks:
      - myspotify-network
      - infra-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # Helper to ensure DB directory has right permissions if needed
  db-init:
    image: alpine
    volumes:
      - ${MUSIC_HOST_ROOT:-${MUSIC_PATH}}/db:/db
    command: chown -R 1000:1000 /db
    networks:
      - myspotify-network

networks:
  myspotify-network:
    driver: bridge
  infra-net: 
    external: true