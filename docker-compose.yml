# Backend only. TLS / tunnel / reverse proxy (Caddy, nginx, Traefik, cloudflared, etc.)
# live in separate infra; optional external network below lets a proxy on that network
# reach this service as host name "backend" port 8000.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ${MUSIC_PATH}/library:/app/library
      - ${MUSIC_PATH}/cache:/app/cache
      - ${MUSIC_PATH}/db:/app/db
      - ./backend/app:/app/app
    env_file: .env
    depends_on:
      - db-init
    networks:
      - myspotify-network
      - infra-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # Helper to ensure DB directory has right permissions if needed
  db-init:
    image: alpine
    volumes:
      - ${MUSIC_PATH}/db:/db
    command: chown -R 1000:1000 /db
    networks:
      - myspotify-network

networks:
  myspotify-network:
    driver: bridge
  infra-net: 
    external: true